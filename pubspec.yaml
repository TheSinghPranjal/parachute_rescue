name: parachute_rescue
description: "Sky Rescue Panic — a hand-drawn parachute rescue arcade game."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.2
  flame_audio: ^2.12.2
  # 3.4.x requires Dart ^3.12; 3.3.2 is the newest release compatible with Dart 3.11.
  flutter_riverpod: ^3.3.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flame_test: ^2.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
  fonts:
    - family: Lilita
      fonts:
        - asset: assets/fonts/LilitaOne-Regular.ttf
    - family: PatrickHand
      fonts:
        - asset: assets/fonts/PatrickHand-Regular.ttf
